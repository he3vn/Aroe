[package]
name = "resty"
version = "0.4.0"
edition = "2024"
description = "A cozy terminal anime recommender"
license = "MIT"

[[bin]]
name = "resty"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = "0.29"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
