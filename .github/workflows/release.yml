name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: aroe-macos
            binary_name: aroe
          - os: ubuntu-latest
            artifact_name: aroe-linux
            binary_name: aroe
          - os: windows-latest
            artifact_name: aroe-windows.exe
            binary_name: aroe.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Prepare binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/release/${{ matrix.binary_name }} ${{ matrix.artifact_name }}
          chmod +x ${{ matrix.artifact_name }}

      - name: Prepare binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          copy target\release\${{ matrix.binary_name }} ${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release_assets
          find artifacts -type f -exec cp {} release_assets/ \;
          ls -lh release_assets/

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          # Git tags cannot have spaces — sanitize it automatically
          TAG=$(echo "$RAW_TAG" | tr -s ' ' '-' | tr -cd '[:alnum:]._-')
          if [ -z "$TAG" ]; then TAG="v1.0.0"; fi
          echo "Sanitized tag: $TAG"
          gh release create "$TAG" release_assets/* --title "Release $TAG" --notes "Aroe release $TAG" || \
          gh release upload "$TAG" release_assets/* --clobber
